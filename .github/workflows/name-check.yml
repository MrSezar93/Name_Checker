name: 🔎 Name Availability Check

# ─────────────────────────────────────────────────────────────────────────────
# Secrets اختیاری (Settings → Secrets and variables → Actions):
#   IG_SESSIONID        کوکی sessionid یک اکانت فرعی اینستاگرام → مطمئن‌ترین روش برای اینستاگرام
#   PROXY_URL           پراکسی (مثلاً http://user:pass@host:port) برای سایت‌های PROXY_SITES
#   TELEGRAM_BOT_TOKEN  توکن ربات تلگرام برای ارسال نتیجه
#   TELEGRAM_CHAT_ID    آیدی چت/کانالی که نتیجه به آن فرستاده شود
# Variables اختیاری:
#   PROXY_SITES         سایت‌هایی که از PROXY_URL استفاده کنند (پیش‌فرض: instagram)
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      fa_name:
        description: "نام فارسی (برای دامنه فارسی) — مثال: علی رضایی"
        required: false
        type: string
      en_name:
        description: "نام انگلیسی (برای دامنه و یوزرنیم‌ها) — مثال: ali rezaei"
        required: false
        type: string
      categories:
        description: "دسته‌ها: domain,social,iran,dev"
        required: false
        default: "domain,social,iran,dev"
        type: string
      sites:
        description: "(اختیاری) فقط این سایت‌ها، مثل instagram,telegram,bale,domain — دسته‌ها را نادیده می‌گیرد"
        required: false
        type: string
      exclude:
        description: "(اختیاری) حذف این سایت‌ها، مثل facebook,kick"
        required: false
        type: string
      tlds:
        description: "پسوندهای دامنه"
        required: false
        default: "ir,ایران,com"
        type: string
      variants:
        description: "بررسی حالت‌های جایگزین (name_ir, thename, nameofficial, ...)"
        required: false
        default: false
        type: boolean
      use_tor:
        description: "استفاده از Tor برای اینستاگرام (عوض کردن IP هنگام محدودیت 429)"
        required: false
        default: true
        type: boolean
      runner:
        description: "ماشین اجرا (برای پلتفرم‌های ایرانی، runner خودمیزبان در ایران بهتر است)"
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, self-hosted]

  # اجرا از طریق API:
  # curl -X POST -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/OWNER/REPO/dispatches \
  #   -d '{"event_type":"name-check","client_payload":{"fa_name":"علی رضایی","en_name":"ali rezaei"}}'
  repository_dispatch:
    types: [name-check]

permissions:
  contents: read

concurrency:
  group: name-check-${{ github.run_id }}

jobs:
  check:
    name: Check ${{ inputs.en_name || github.event.client_payload.en_name || inputs.fa_name || github.event.client_payload.fa_name }}
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      # ورودی‌ها فقط از طریق env به اسکریپت می‌رسند (جلوگیری از Script Injection)
      FA_NAME:    ${{ inputs.fa_name    || github.event.client_payload.fa_name    || '' }}
      EN_NAME:    ${{ inputs.en_name    || github.event.client_payload.en_name    || '' }}
      CATEGORIES: ${{ inputs.categories || github.event.client_payload.categories || 'domain,social,iran,dev' }}
      SITES:      ${{ inputs.sites      || github.event.client_payload.sites      || '' }}
      EXCLUDE:    ${{ inputs.exclude    || github.event.client_payload.exclude    || '' }}
      TLDS:       ${{ inputs.tlds       || github.event.client_payload.tlds       || 'ir,ایران,com' }}
      VARIANTS:   ${{ inputs.variants   || github.event.client_payload.variants   || false }}
      USE_TOR:    ${{ github.event_name == 'workflow_dispatch' && inputs.use_tor || github.event.client_payload.use_tor || false }}
      IG_SESSIONID: ${{ secrets.IG_SESSIONID }}
      PROXY_URL:    ${{ secrets.PROXY_URL }}
      PROXY_SITES:  ${{ vars.PROXY_SITES || 'instagram' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # برای API گیت‌هاب (۵۰۰۰ درخواست در ساعت به‌جای ۶۰)
      TG_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TG_CHAT:      ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate input
        run: |
          if [ -z "${FA_NAME// }" ] && [ -z "${EN_NAME// }" ]; then
            echo "::error title=ورودی خالی::حداقل یکی از fa_name یا en_name باید وارد شود."
            exit 1
          fi
          if [ -z "${EN_NAME// }" ]; then
            echo "::warning::نام انگلیسی وارد نشده؛ فقط دامنه‌ی فارسی بررسی می‌شود (یوزرنیم‌ها لاتین هستند)."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start Tor
        id: tor
        if: env.USE_TOR == 'true' && env.PROXY_URL == ''
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tor > /dev/null
          printf 'SocksPort 9050\nControlPort 9051\nCookieAuthentication 0\n' | sudo tee /etc/tor/torrc > /dev/null
          sudo systemctl restart tor || sudo service tor restart
          for i in $(seq 1 45); do
            if curl -s --max-time 10 --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip | grep -q '"IsTor":true'; then
              echo "Tor is ready"; echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep 2
          done
          echo "::warning::Tor بالا نیامد؛ بدون Tor ادامه می‌دهیم."

      - name: Run name checker
        run: |
          args=(--no-input --categories "$CATEGORIES" --tlds "$TLDS"
                --workers 8 --delay 0.6 --timeout 20
                --json results.json --csv results.csv --markdown "$GITHUB_STEP_SUMMARY")
          [ -n "$FA_NAME" ]  && args+=(--fa "$FA_NAME")
          [ -n "$EN_NAME" ]  && args+=(--en "$EN_NAME")
          [ -n "$SITES" ]    && args+=(--sites "$SITES")
          [ -n "$EXCLUDE" ]  && args+=(--exclude "$EXCLUDE")
          [ "$VARIANTS" = "true" ] && args+=(--variants)

          if [ -n "$PROXY_URL" ]; then
            args+=(--proxy "$PROXY_URL" --proxy-sites "$PROXY_SITES")
            echo "🔀 پراکسی برای: $PROXY_SITES"
          elif [ "${{ steps.tor.outputs.ready }}" = "true" ]; then
            args+=(--proxy socks5h://127.0.0.1:9050 --proxy-sites instagram --tor-control 9051)
            echo "🧅 Tor برای اینستاگرام فعال است"
          fi
          [ -n "$IG_SESSIONID" ] && echo "🔑 اینستاگرام با sessionid بررسی می‌شود"

          python name_checker.py "${args[@]}"

      - name: Annotations
        if: always()
        run: |
          [ -f results.json ] || exit 0
          python - <<'PY'
          import json
          rows = json.load(open("results.json", encoding="utf-8"))
          for r in rows:
              if r["status"] == "available":
                  print(f"::notice title=✅ آزاد — {r['platform']}::{r['target']}")
          unk = sum(r["status"] == "unknown" for r in rows)
          if unk:
              print(f"::warning title=موارد نامشخص::{unk} مورد نامشخص ماند — جزئیات در Summary")
          PY

      - name: Send result to Telegram
        if: always() && env.TG_TOKEN != '' && env.TG_CHAT != ''
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f results.json ] || exit 0
          python - <<'PY'
          import json, os, html, requests
          rows = json.load(open("results.json", encoding="utf-8"))
          free = [r for r in rows if r["status"] == "available"]
          cnt = {s: sum(r["status"] == s for r in rows) for s in ("available", "taken", "reserved", "unknown")}
          name = " / ".join(x for x in (os.environ.get("FA_NAME"), os.environ.get("EN_NAME")) if x)
          lines = [f"🔎 <b>نتیجه بررسی:</b> {html.escape(name)}",
                   f"✅ {cnt['available']}  ❌ {cnt['taken']}  💰 {cnt['reserved']}  ❓ {cnt['unknown']}", ""]
          for r in free[:60]:
              lines.append(f"✅ {html.escape(r['platform'])}: <code>{html.escape(r['target'])}</code>")
          lines += ["", f'<a href="{os.environ["RUN_URL"]}">گزارش کامل</a>']
          requests.post(f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage", timeout=20,
                        data={"chat_id": os.environ["TG_CHAT"], "text": "\n".join(lines)[:4000],
                              "parse_mode": "HTML", "disable_web_page_preview": "true"}).raise_for_status()
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-check-${{ github.run_number }}
          path: |
            results.json
            results.csv
          if-no-files-found: ignore
          retention-days: 30
